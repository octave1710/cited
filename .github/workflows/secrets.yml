name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # a key committed by accident is the one mistake that cannot be undone by a revert,
      # so the whole history is scanned on every push, not just the diff
      - name: Fail on a committed credential
        run: |
          if git grep -nIE 'sk-proj-[A-Za-z0-9_-]{20}|sk-ant-api03-[A-Za-z0-9_-]{20}|apify_api_[A-Za-z0-9]{20}|-----BEGIN (RSA|OPENSSH|PRIVATE)' $(git rev-list --all); then
            echo "::error::a credential is present in the history"
            exit 1
          fi
          echo "no credential found in any commit"
