name: CI

on:
  push:
    branches: [main]
  pull_request:

# the workflow reads the repo and nothing else
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # no key is present in CI, so every adapter falls back to replay and the suite
      # must pass without touching a paid API. That is the contract, not a convenience.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      - name: Production build
        run: npx next build
